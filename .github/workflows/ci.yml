name: CI

on:
  push:
    branches: ["main", "Heinner-Sebastian-Michelle"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Copiar archivo de entorno
        run: cp .env.example .env

      - name: Instalar dependencias con Composer
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Generar clave de aplicación
        run: php artisan key:generate

      - name: Ejecutar migraciones
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Ejecutar tests con Pest
        run: php artisan test --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
